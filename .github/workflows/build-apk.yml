name: Build Sultan Agent APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify Telegram — Build Started
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SHA7="${GITHUB_SHA::7}"
          curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=Build shuru! Commit: ${SHA7} | ~15-20 min mein APK ready" || echo "Telegram skipped"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK via EAS
        id: eas_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"
        run: |
          set +e

          echo "Starting EAS build..."
          eas build --platform android --profile production --non-interactive --wait
          EAS_EXIT=$?
          echo "EAS exit: ${EAS_EXIT}"

          echo "Fetching build list..."
          BUILD_JSON=$(eas build:list --platform android --limit 1 --non-interactive --json 2>&1 || echo "[]")
          echo "Raw build list: ${BUILD_JSON}"

          APK_URL=$(echo "${BUILD_JSON}" | node -e "
            let d=''; process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              try {
                const arr = JSON.parse(d);
                const b = Array.isArray(arr) ? arr[0] : arr;
                const url = b?.artifacts?.buildUrl || b?.artifact?.url || '';
                console.log(url);
              } catch(e) { console.log(''); }
            });
          " 2>/dev/null || echo "")

          echo "APK URL found: ${APK_URL}"
          echo "apk_url=${APK_URL}" >> $GITHUB_OUTPUT

          if [ ${EAS_EXIT} -eq 0 ] && [ -n "${APK_URL}" ]; then
            echo "build_status=success" >> $GITHUB_OUTPUT
          elif [ -n "${APK_URL}" ]; then
            echo "build_status=success" >> $GITHUB_OUTPUT
          else
            echo "build_status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Send APK to Telegram
        if: steps.eas_build.outputs.build_status == 'success'
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_URL: ${{ steps.eas_build.outputs.apk_url }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          SHA7="${GITHUB_SHA::7}"
          echo "Downloading APK from ${APK_URL}..."
          curl -L -o sultan-agent.apk \
            -H "Authorization: Bearer ${EXPO_TOKEN}" \
            "${APK_URL}" || { echo "Direct download failed, trying without auth..."; curl -L -o sultan-agent.apk "${APK_URL}"; }

          SIZE=$(stat -c%s sultan-agent.apk 2>/dev/null || echo 0)
          echo "APK size: ${SIZE} bytes"
          MAX=$((49*1024*1024))

          if [ "${SIZE}" -gt 100000 ] && [ "${SIZE}" -le "${MAX}" ]; then
            curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@sultan-agent.apk" \
              -F "caption=Sultan Agent v1.1 APK! Commit: ${SHA7} | Firebase+MultiAI+Memory" || echo "Telegram send skipped"
          else
            curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=APK ready! ${APK_URL} | Commit: ${SHA7}" || echo "Telegram skipped"
          fi

      - name: Notify Telegram — Build Failed
        if: steps.eas_build.outputs.build_status != 'success'
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SHA7="${GITHUB_SHA::7}"
          curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=Build fail! Commit: ${SHA7} | EAS logs: https://expo.dev/accounts/blcobra858/projects/sultan-agent/builds" || echo "Skipped"
