name: Build Sultan Agent APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK with EAS (full logs)
        id: eas_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"
        run: |
          set +e
          OUTPUT=$(eas build --platform android --profile production --non-interactive --wait 2>&1)
          EXIT_CODE=$?
          echo "========== EAS BUILD OUTPUT =========="
          echo "$OUTPUT"
          echo "======================================"

          APK_URL=$(echo "$OUTPUT" | grep -oE 'https://[^[:space:]]+\.apk' | head -1)
          if [ -z "$APK_URL" ]; then
            APK_URL=$(echo "$OUTPUT" | grep -oE 'https://expo\.dev/artifacts/[^[:space:]]+' | head -1)
          fi
          echo "APK URL: $APK_URL"
          echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT

          if [ $EXIT_CODE -eq 0 ] && [ -n "$APK_URL" ]; then
            echo "build_status=success" >> $GITHUB_OUTPUT
          else
            echo "build_status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Send APK to Telegram
        if: steps.eas_build.outputs.build_status == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_URL: ${{ steps.eas_build.outputs.apk_url }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          curl -L -o sultan-agent.apk "$APK_URL"
          APK_SIZE=$(stat -c%s sultan-agent.apk)
          MAX_SIZE=$((49 * 1024 * 1024))
          if [ "$APK_SIZE" -le "$MAX_SIZE" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@sultan-agent.apk" \
              -F "caption=Sultan Agent APK ready! Install karo. Commit: $SHORT_SHA"
          else
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=APK taiyaar! Download: $APK_URL | Commit: $SHORT_SHA"
          fi

      - name: Notify failure
        if: steps.eas_build.outputs.build_status != 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=Build fail hui. Logs: https://expo.dev/accounts/blcobra858/projects/sultan-agent/builds | Commit: $SHORT_SHA"
