name: Build Sultan Agent APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit APK build to EAS
        id: eas_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: |
          OUTPUT=$(eas build --platform android --profile production --non-interactive --no-wait 2>&1)
          echo "$OUTPUT"
          BUILD_ID=$(echo "$OUTPUT" | grep "See logs:" | sed 's|.*/builds/||')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "Build ID: $BUILD_ID"

      - name: Wait for EAS build to finish
        id: wait_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          sleep 120
          STATUS="unknown"
          APK_URL=""
          for i in $(seq 1 20); do
            RESULT=$(eas build:list --platform android --limit 1 --non-interactive --json 2>/dev/null || echo "[]")
            STATUS=$(echo "$RESULT" | node -p "
              try {
                const d = JSON.parse(require('fs').readFileSync('/dev/stdin','utf-8'));
                d[0] ? d[0].status : 'unknown'
              } catch(e) { 'unknown' }
            ")
            echo "Attempt $i - Status: $STATUS"
            if [ "$STATUS" = "FINISHED" ]; then
              APK_URL=$(echo "$RESULT" | node -p "
                try {
                  const d = JSON.parse(require('fs').readFileSync('/dev/stdin','utf-8'));
                  (d[0] && d[0].artifacts && d[0].artifacts.buildUrl) ? d[0].artifacts.buildUrl : ''
                } catch(e) { '' }
              ")
              echo "APK Download URL: $APK_URL"
              echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT
              echo "build_status=success" >> $GITHUB_OUTPUT
              break
            elif [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELED" ]; then
              echo "build_status=failed" >> $GITHUB_OUTPUT
              break
            fi
            sleep 60
          done
          if [ "$STATUS" != "FINISHED" ] && [ "$STATUS" != "ERRORED" ] && [ "$STATUS" != "CANCELED" ]; then
            echo "build_status=timeout" >> $GITHUB_OUTPUT
          fi

      - name: Send APK to Telegram
        if: steps.wait_build.outputs.build_status == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_URL: ${{ steps.wait_build.outputs.apk_url }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "Downloading APK from: $APK_URL"
          curl -L -o sultan-agent.apk "$APK_URL"
          APK_SIZE=$(stat -c%s sultan-agent.apk)
          echo "APK size: $APK_SIZE bytes"
          MAX_SIZE=$((49 * 1024 * 1024))
          if [ "$APK_SIZE" -le "$MAX_SIZE" ]; then
            echo "Sending APK file directly to Telegram..."
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@sultan-agent.apk" \
              -F "caption=Sultan Agent APK taiyaar hai! Install karo seedha. Commit: $SHORT_SHA"
          else
            echo "APK too large for Telegram ($APK_SIZE bytes), sending link..."
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "text=Sultan Agent APK taiyaar hai! APK download karo: $APK_URL | Commit: $SHORT_SHA"
          fi

      - name: Notify Telegram on failure
        if: steps.wait_build.outputs.build_status != 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_STATUS: ${{ steps.wait_build.outputs.build_status }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "$BUILD_STATUS" = "failed" ]; then
            MSG="Sultan Agent APK Build FAIL ho gayi! EAS pe check karo: https://expo.dev/accounts/blcobra858/projects/sultan-agent/builds | Commit: $SHORT_SHA"
          else
            MSG="Sultan Agent APK Build timeout ho gayi (20 min+). EAS pe check karo: https://expo.dev/accounts/blcobra858/projects/sultan-agent/builds | Commit: $SHORT_SHA"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "text=$MSG"
