name: Build Sultan Agent APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Telegram 10pct — Checkout done
        continue-on-error: true
        run: |
          SHA7="${GITHUB_SHA::7}"
          curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode=Markdown \
            --data-urlencode "text=*Sultan Agent APK Build*%0A%0ACommit: ${SHA7}%0A%E2%96%930%E2%96%91%E2%96%91%E2%96%91%E2%96%91%E2%96%91%E2%96%91%E2%96%91%E2%96%91%E2%96%91 10%25 - Checkout OK" || true

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Telegram 40pct — Dependencies done
        continue-on-error: true
        run: |
          curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode=Markdown \
            --data-urlencode "text=*Sultan Agent APK Build*%0A%0A%E2%96%93%E2%96%93%E2%96%93%E2%96%93%E2%96%91%E2%96%91%E2%96%91%E2%96%91%E2%96%91%E2%96%91 40%25 - Dependencies OK%0AEas CLI setup ho raha hai..." || true

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Telegram 60pct — EAS ready
        continue-on-error: true
        run: |
          curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode=Markdown \
            --data-urlencode "text=*Sultan Agent APK Build*%0A%0A%E2%96%93%E2%96%93%E2%96%93%E2%96%93%E2%96%93%E2%96%93%E2%96%91%E2%96%91%E2%96%91%E2%96%91 60%25 - EAS Ready%0AExpo servers pe build chal raha hai...%0AAlag 10-15 min lagenge!" || true

      - name: Build APK via EAS
        id: eas_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"
        run: |
          set +e
          eas build --platform android --profile production --non-interactive --wait 2>&1 | tee /tmp/eas_out.txt
          EAS_EXIT=${PIPESTATUS[0]}

          if grep -q "used its Android builds from the Free plan" /tmp/eas_out.txt; then
            echo "build_status=limit" >> $GITHUB_OUTPUT
            exit 0
          fi

          BUILD_JSON=$(eas build:list --platform android --limit 1 --non-interactive --json 2>&1 || echo "[]")
          APK_URL=$(echo "${BUILD_JSON}" | node -e "
            let d='';
            process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              try {
                const a=JSON.parse(d);
                const b=Array.isArray(a)?a[0]:a;
                console.log(b?.artifacts?.buildUrl||b?.artifact?.url||'');
              } catch(e){ console.log(''); }
            });
          " 2>/dev/null || echo "")

          echo "apk_url=${APK_URL}" >> $GITHUB_OUTPUT
          if [ -n "${APK_URL}" ]; then
            echo "build_status=success" >> $GITHUB_OUTPUT
          else
            echo "build_status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Telegram — Expo Free Plan Limit
        if: steps.eas_build.outputs.build_status == 'limit'
        continue-on-error: true
        run: |
          curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode=Markdown \
            --data-urlencode "text=*Expo Free Plan Limit!*%0A%0A%E2%96%93%E2%96%93%E2%96%93%E2%96%93%E2%96%93%E2%96%93%E2%96%91%E2%96%91%E2%96%91%E2%96%91 60%25 - Ruk gaya%0A%0AIs mahine ke builds khatam!%0AJune 1 pe reset hoga.%0ACode theek hai - sirf quota issue hai." || true

      - name: Telegram 90pct — Sending APK
        if: steps.eas_build.outputs.build_status == 'success'
        continue-on-error: true
        run: |
          curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode=Markdown \
            --data-urlencode "text=*Sultan Agent APK Build*%0A%0A%E2%96%93%E2%96%93%E2%96%93%E2%96%93%E2%96%93%E2%96%93%E2%96%93%E2%96%93%E2%96%93%E2%96%91 90%25 - APK bana!%0ATelegram pe bhej raha hoon..." || true

      - name: Send APK to Telegram
        if: steps.eas_build.outputs.build_status == 'success'
        continue-on-error: true
        env:
          APK_URL: ${{ steps.eas_build.outputs.apk_url }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          SHA7="${GITHUB_SHA::7}"
          curl -L -o sultan-agent.apk \
            -H "Authorization: Bearer ${EXPO_TOKEN}" \
            "${APK_URL}" || curl -L -o sultan-agent.apk "${APK_URL}"

          SIZE=$(stat -c%s sultan-agent.apk 2>/dev/null || echo 0)
          MAX=$((49*1024*1024))

          if [ "${SIZE}" -gt 100000 ] && [ "${SIZE}" -le "${MAX}" ]; then
            curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@sultan-agent.apk" \
              -F "caption=Sultan Agent v3.0 APK Ready! Commit: ${SHA7} - Install karo!" || true
          else
            curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" \
              --data-urlencode "text=APK Ready! Download: ${APK_URL}" || true
          fi

          curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode=Markdown \
            --data-urlencode "text=*Sultan Agent v3.0*%0A%0A%E2%96%93%E2%96%93%E2%96%93%E2%96%93%E2%96%93%E2%96%93%E2%96%93%E2%96%93%E2%96%93%E2%96%93 100%25 DONE!%0A%0AInstall karo aur enjoy karo!" || true

      - name: Telegram — Build Failed
        if: steps.eas_build.outputs.build_status == 'failed'
        continue-on-error: true
        run: |
          SHA7="${GITHUB_SHA::7}"
          curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode=Markdown \
            --data-urlencode "text=Build fail! Commit: ${SHA7}%0ALogs: expo.dev/accounts/blcobra858/projects/sultan-agent/builds" || true
