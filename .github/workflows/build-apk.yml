name: Build Sultan Agent APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit APK build to EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: eas build --platform android --profile production --non-interactive --no-wait

      - name: Build submitted!
        run: |
          echo "=============================="
          echo "APK build submitted to EAS!"
          echo "Check: https://expo.dev/accounts/suhanshaikh78957/projects/sultan-agent/builds"
          echo "=============================="

