name: Build Sultan Agent APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify Telegram — Build Started
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SHA7="${GITHUB_SHA::7}"
          MSG="${GITHUB_EVENT_BEFORE:-dispatch}"
          TEXT="Build shuru ho gayi! Commit: ${SHA7} | Branch: ${GITHUB_REF_NAME} | ~15-20 min mein APK ready"
          curl -sf -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}&text=${TEXT}" || echo "Telegram notification skipped"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK via EAS
        id: eas_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"
        run: |
          set +e
          eas build --platform android --profile production --non-interactive --wait
          EXIT_CODE=$?
          echo "EAS exit code: ${EXIT_CODE}"

          BUILD_JSON=$(eas build:list --platform android --limit 1 --non-interactive --json 2>/dev/null || echo "[]")
          echo "Build JSON: ${BUILD_JSON}"

          APK_URL=$(echo "${BUILD_JSON}" | node -e "
            let d=''; process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              try {
                const builds=JSON.parse(d);
                const b=Array.isArray(builds)?builds[0]:builds;
                console.log((b&&b.artifacts&&b.artifacts.buildUrl)||'');
              } catch { console.log(''); }
            });
          " 2>/dev/null || echo "")

          echo "APK URL: ${APK_URL}"
          echo "apk_url=${APK_URL}" >> $GITHUB_OUTPUT

          if [ ${EXIT_CODE} -eq 0 ] && [ -n "${APK_URL}" ]; then
            echo "build_status=success" >> $GITHUB_OUTPUT
          else
            echo "build_status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Send APK to Telegram
        if: steps.eas_build.outputs.build_status == 'success'
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_URL: ${{ steps.eas_build.outputs.apk_url }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          SHA7="${GITHUB_SHA::7}"
          curl -L -o sultan-agent.apk \
            -H "Authorization: Bearer ${EXPO_TOKEN}" \
            "${APK_URL}" || exit 1

          FILE_SIZE=$(stat -c%s sultan-agent.apk 2>/dev/null || echo 0)
          MAX_TG=$((49*1024*1024))

          if [ "${FILE_SIZE}" -gt 100000 ] && [ "${FILE_SIZE}" -le "${MAX_TG}" ]; then
            curl -sf -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@sultan-agent.apk" \
              -F "caption=Sultan Agent v1.1 APK taiyaar! Build: ${SHA7}" || echo "Telegram send skipped"
          else
            curl -sf -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}&text=APK ready! Download: ${APK_URL}" || echo "Telegram message skipped"
          fi

      - name: Notify Telegram — Build Failed
        if: steps.eas_build.outputs.build_status != 'success'
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SHA7="${GITHUB_SHA::7}"
          curl -sf -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}&text=Build fail hui! Commit: ${SHA7} | Check: https://expo.dev/accounts/blcobra858/projects/sultan-agent/builds" || echo "Telegram notification skipped"
