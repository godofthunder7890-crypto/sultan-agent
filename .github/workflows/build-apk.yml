name: Deploy Bot + Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── Job 1: Deploy Bot to Railway ────────────────────────────────────────────
  deploy-bot:
    name: Deploy Bot to Railway
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Set env vars on Railway
        continue-on-error: true
        env:
          RAILWAY_TOKEN:    ${{ secrets.RAILWAY_API_KEY }}
          TG_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_KEY:         ${{ secrets.GROQ_API_KEY }}
          GEMINI_KEY:       ${{ secrets.GEMINI_API_KEY }}
          OPENAI_KEY:       ${{ secrets.OPENAI_API_KEY }}
          SERPER_KEY:       ${{ secrets.SERPER_API_KEY }}
          ELEVEN_KEY:       ${{ secrets.ELEVENLABS_API_KEY }}
          GH_PAT:           ${{ secrets.GITHUB_TOKEN }}
        run: |
          node << 'NODEJS'
          const https = require('https');
          const RAILWAY_TOKEN = process.env.RAILWAY_TOKEN;
          const PROJECT_ID = '1450a2ad-ffe6-478f-97ae-4cabdd0f5dea';
          const SERVICE_ID = '4e6ab161-cc6c-4945-81f6-b6242b4eb1f0';
          const ENV_ID     = 'b591b4fe-3105-4155-aa48-aed73d794e5b';
          const vars = {
            TELEGRAM_BOT_TOKEN: process.env.TG_BOT_TOKEN,
            ADMIN_CHAT_ID: process.env.TG_CHAT_ID,
            GROQ_API_KEY: process.env.GROQ_KEY,
            GEMINI_API_KEY: process.env.GEMINI_KEY,
            OPENAI_API_KEY: process.env.OPENAI_KEY,
            SERPER_API_KEY: process.env.SERPER_KEY,
            ELEVENLABS_API_KEY: process.env.ELEVEN_KEY,
            GITHUB_ACCESS_TOKEN: process.env.GH_PAT,
            FIREBASE_API_KEY: 'AIzaSyBPQxmPvldjJ5Zt03E5i2xrrhFWpdpYd-s',
            FIREBASE_PROJECT_ID: 'v11345',
          };
          function gql(q) {
            return new Promise(res => {
              const body = JSON.stringify({ query: q });
              const req = https.request({ hostname:'backboard.railway.app', path:'/graphql/v2', method:'POST', timeout:20000,
                headers:{'Authorization':'Bearer '+RAILWAY_TOKEN,'Content-Type':'application/json','Content-Length':Buffer.byteLength(body)}
              }, r => { let d=''; r.on('data',c=>d+=c); r.on('end',()=>{ try{res(JSON.parse(d));}catch{res({_e:d.slice(0,100)});} }); });
              req.on('error',e=>res({_e:e.message})); req.on('timeout',()=>{req.destroy();res({_e:'timeout'});}); req.end(body);
            });
          }
          (async()=>{
            for(const [k,v] of Object.entries(vars)) {
              if(!v){console.log('SKIP:',k);continue;}
              const safe=v.replace(/\\/g,'\\\\').replace(/"/g,'\\"');
              const r=await gql('mutation{variableUpsert(input:{projectId:"'+PROJECT_ID+'",environmentId:"'+ENV_ID+'",serviceId:"'+SERVICE_ID+'",name:"'+k+'",value:"'+safe+'"})}');
              console.log(r._e?'FAIL:'+k+' '+r._e:'OK:'+k);
            }
          })();
          NODEJS

      - name: Deploy via Railway CLI
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_KEY }}
        run: |
          cd bot-server
          railway up --service 4e6ab161-cc6c-4945-81f6-b6242b4eb1f0 --environment b591b4fe-3105-4155-aa48-aed73d794e5b --detach || echo "Railway CLI failed - token may need refresh"

  # ─── Job 2: Build Android APK (INDEPENDENT - always runs) ────────────────────
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK via EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          OWNER=$(eas whoami | head -1 | awk '{print $1}')
          echo "Logged in as: $OWNER"
          node -e "
            const fs=require('fs');
            const app=JSON.parse(fs.readFileSync('app.json','utf8'));
            app.expo.owner='$OWNER';
            if(!app.expo.extra) app.expo.extra={};
            app.expo.extra.eas={};
            fs.writeFileSync('app.json',JSON.stringify(app,null,2));
            console.log('owner set to:', app.expo.owner);
          "
          eas project:init --non-interactive --force 2>/dev/null || true
          eas build --platform android --profile production --non-interactive --no-wait
          echo "APK build submitted to EAS!"

      - name: Telegram - APK Status
        if: always()
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = "success" ]; then
            MSG="Sultan Agent APK v7.0 EAS pe submit ho gaya! 10-15 min mein bot Telegram pe APK file bhejega! Track: https://expo.dev/accounts/haniyashaikh777/projects/sultan-agent/builds"
          else
            MSG="APK build fail hua. Logs check karo: https://github.com/godofthunder7890-crypto/sultan-agent/actions"
          fi
          curl -s -o /dev/null --max-time 10 \
            -X POST "https://api.telegram.org/bot${BOT}/sendMessage" \
            -d "chat_id=${CID}" \
            --data-urlencode "text=${MSG}"
