name: Build APK + Deploy Bot — Sultan Agent

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── Job 1: Deploy Bot to Railway ───────────────────────────────────────────
  deploy-bot:
    name: Deploy Bot to Railway
    runs-on: ubuntu-latest
    steps:
      - name: Set Railway env vars + trigger deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          PROJECT_ID="1450a2ad-ffe6-478f-97ae-4cabdd0f5dea"
          SERVICE_ID="4e6ab161-cc6c-4945-81f6-b6242b4eb1f0"
          ENV_ID="b591b4fe-3105-4155-aa48-aed73d794e5b"

          set_var() {
            curl -s -X POST https://backboard.railway.app/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\":\"mutation { variableUpsert(input: { projectId: \\\"$PROJECT_ID\\\", environmentId: \\\"$ENV_ID\\\", serviceId: \\\"$SERVICE_ID\\\", name: \\\"$1\\\", value: \\\"$2\\\" }) }\"}" > /dev/null
            echo "  Set $1 ✓"
          }

          echo "Setting all Railway environment variables..."
          set_var "TELEGRAM_BOT_TOKEN" "$TELEGRAM_BOT_TOKEN"
          set_var "ADMIN_CHAT_ID" "$ADMIN_CHAT_ID"
          set_var "GROQ_API_KEY" "$GROQ_API_KEY"
          set_var "GEMINI_API_KEY" "$GEMINI_API_KEY"
          set_var "OPENAI_API_KEY" "$OPENAI_API_KEY"
          set_var "SERPER_API_KEY" "$SERPER_API_KEY"
          set_var "ELEVENLABS_API_KEY" "$ELEVENLABS_API_KEY"
          set_var "FIREBASE_API_KEY" "AIzaSyBPQxmPvldjJ5Zt03E5i2xrrhFWpdpYd-s"
          set_var "FIREBASE_PROJECT_ID" "v11345"
          set_var "FIREBASE_USER_ID" "sultan"

          echo "Triggering Railway redeployment..."
          curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation { serviceInstanceDeploy(serviceId: \\\"$SERVICE_ID\\\", environmentId: \\\"$ENV_ID\\\") }\"}" > /dev/null
          echo "✅ Bot v6.0 deployed to Railway with all keys!"

  # ─── Job 2: Build Android APK ────────────────────────────────────────────────
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK (production profile)
        run: eas build --platform android --profile production --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build started
        run: |
          echo "✅ APK build submitted to EAS Cloud!"
          echo "Track at: https://expo.dev/accounts/blcobra858/projects/sultan-agent/builds"
