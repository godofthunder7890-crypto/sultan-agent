name: Build Sultan Agent APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK with EAS
        id: eas_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"
        run: |
          set +e

          # Build aur wait karo
          eas build --platform android --profile production --non-interactive --wait
          EXIT_CODE=$?
          echo "EAS exit code: $EXIT_CODE"

          # Latest build ka JSON lo — artifact URL nikalo
          BUILD_JSON=$(eas build:list --platform android --limit 1 --non-interactive --json 2>/dev/null)
          echo "Build JSON: $BUILD_JSON"

          APK_URL=$(node -e "
            const builds = JSON.parse('$BUILD_JSON'.replace(/'/g,'"'));
            const b = Array.isArray(builds) ? builds[0] : builds;
            console.log((b && b.artifacts && b.artifacts.buildUrl) || '');
          " 2>/dev/null)

          echo "APK URL: $APK_URL"
          echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT

          if [ $EXIT_CODE -eq 0 ] && [ -n "$APK_URL" ]; then
            echo "build_status=success" >> $GITHUB_OUTPUT
          else
            echo "build_status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Download and Send APK to Telegram
        if: steps.eas_build.outputs.build_status == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_URL: ${{ steps.eas_build.outputs.apk_url }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          # EXPO_TOKEN se download karo (expo.dev URLs auth chahti hain)
          curl -L -o sultan-agent.apk \
            -H "Authorization: Bearer $EXPO_TOKEN" \
            "$APK_URL"

          APK_SIZE=$(stat -c%s sultan-agent.apk 2>/dev/null || echo 0)
          MAX_SIZE=$((49 * 1024 * 1024))

          if [ "$APK_SIZE" -gt 100000 ] && [ "$APK_SIZE" -le "$MAX_SIZE" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@sultan-agent.apk" \
              -F "caption=✅ Sultan Agent APK taiyaar! Install karo. Build: $SHORT_SHA"
            echo "APK Telegram pe bhej diya!"
          else
            # APK bada ya download fail — link bhejo
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=✅ APK taiyaar! Seedha download karo: $APK_URL | Build: $SHORT_SHA"
            echo "APK link Telegram pe bhej diya!"
          fi

      - name: Notify failure
        if: steps.eas_build.outputs.build_status != 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ Build fail hui! EAS logs: https://expo.dev/accounts/blcobra858/projects/sultan-agent/builds | Commit: $SHORT_SHA"
