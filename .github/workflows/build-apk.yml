name: Build Sultan Agent APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit APK build to EAS
        id: eas_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: |
          OUTPUT=$(eas build --platform android --profile production --non-interactive --no-wait 2>&1)
          echo "$OUTPUT"
          BUILD_URL=$(echo "$OUTPUT" | grep "See logs:" | awk '{print $NF}')
          echo "build_url=$BUILD_URL" >> $GITHUB_OUTPUT

      - name: Wait for EAS build to complete
        id: wait_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Waiting for EAS build..."
          sleep 120
          STATUS="unknown"
          APK_URL=""
          for i in $(seq 1 18); do
            JSON=$(eas build:list --platform android --limit 1 --non-interactive --json 2>/dev/null || echo "[]")
            STATUS=$(echo "$JSON" | node -e "
              const c=[];
              process.stdin.on('data',d=>c.push(d));
              process.stdin.on('end',()=>{
                try {
                  const d=JSON.parse(c.join(''));
                  console.log(d[0] ? d[0].status : 'unknown');
                } catch(e) { console.log('unknown'); }
              });
            ")
            echo "Attempt $i: status=$STATUS"
            if [ "$STATUS" = "FINISHED" ]; then
              APK_URL=$(echo "$JSON" | node -e "
                const c=[];
                process.stdin.on('data',d=>c.push(d));
                process.stdin.on('end',()=>{
                  try {
                    const d=JSON.parse(c.join(''));
                    console.log((d[0] && d[0].artifacts && d[0].artifacts.buildUrl) ? d[0].artifacts.buildUrl : '');
                  } catch(e) { console.log(''); }
                });
              ")
              echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT
              echo "build_status=success" >> $GITHUB_OUTPUT
              break
            elif [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELED" ]; then
              echo "build_status=failed" >> $GITHUB_OUTPUT
              break
            fi
            sleep 60
          done
          if [ "$STATUS" != "FINISHED" ] && [ "$STATUS" != "ERRORED" ] && [ "$STATUS" != "CANCELED" ]; then
            echo "build_status=pending" >> $GITHUB_OUTPUT
          fi

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_URL: ${{ steps.eas_build.outputs.build_url }}
          APK_URL: ${{ steps.wait_build.outputs.apk_url }}
          BUILD_STATUS: ${{ steps.wait_build.outputs.build_status }}
        run: |
          if [ "$BUILD_STATUS" = "success" ] && [ -n "$APK_URL" ]; then
            MSG="✅ Sultan Agent APK Ready!

📦 APK Download:
$APK_URL

🔗 EAS Dashboard:
$BUILD_URL

📝 Commit: ${GITHUB_SHA::7}
🌿 Branch: $GITHUB_REF_NAME"
          elif [ "$BUILD_STATUS" = "failed" ]; then
            MSG="❌ Sultan Agent APK Build FAILED!

🔗 EAS Dashboard:
$BUILD_URL

📝 Commit: ${GITHUB_SHA::7}
🌿 Branch: $GITHUB_REF_NAME"
          else
            MSG="🚀 Sultan Agent APK Build Submitted!

⏳ EAS pe build chal rahi hai (~15 min)
Thodi der baad check karo:
$BUILD_URL

📝 Commit: ${GITHUB_SHA::7}
🌿 Branch: $GITHUB_REF_NAME"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -d "parse_mode=HTML"
          echo "Telegram notification sent!"

      - name: Done
        run: |
          echo "=============================="
          echo "APK build submitted to EAS!"
          echo "Check: https://expo.dev/accounts/blcobra858/projects/sultan-agent/builds"
          echo "=============================="
