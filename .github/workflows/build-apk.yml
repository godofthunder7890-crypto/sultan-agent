name: Build Sultan Agent APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 0% ── Build shuru ──────────────────────────────────────
      - name: Telegram — 0% Build Shuru
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SHA7="${GITHUB_SHA::7}"
          MSG="╔══════════════════════╗
║  🤖 SULTAN AGENT BUILD  ║
╚══════════════════════╝

📦 Commit: `${SHA7}`
🕐 $(date '+%H:%M:%S') — Build shuru hua!

Progress:
▓░░░░░░░░░ 10% — Checkout ✅"
          curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "parse_mode=Markdown" || true

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # ── 20% ── Dependencies ────────────────────────────────────
      - name: Telegram — 20% Installing
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="⚙️ *Dependencies install ho rahi hain...*

▓▓░░░░░░░░ 20% — npm install
⏳ Thoda wait karo..."
          curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "parse_mode=Markdown" || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # ── 40% ── EAS Setup ───────────────────────────────────────
      - name: Telegram — 40% Deps Done
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="✅ *Dependencies ready!*

▓▓▓▓░░░░░░ 40% — EAS CLI setup ho raha hai...
🔧 Expo build tools load ho rahe hain"
          curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "parse_mode=Markdown" || true

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # ── 60% ── EAS Build start ─────────────────────────────────
      - name: Telegram — 60% EAS Building
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="🏗️ *APK build shuru — Expo servers pe!*

▓▓▓▓▓▓░░░░ 60% — Building...
☁️ Expo cloud compile kar raha hai
⏳ ~10-15 min aur lagenge, raho ready!"
          curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "parse_mode=Markdown" || true

      - name: Build APK via EAS
        id: eas_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"
        run: |
          set +e
          eas build --platform android --profile production --non-interactive --wait 2>&1 | tee /tmp/eas_output.txt
          EAS_EXIT=${PIPESTATUS[0]}

          # Check for free plan limit error
          if grep -q "used its Android builds from the Free plan" /tmp/eas_output.txt; then
            RESET_DATE=$(grep -o "Mon [A-Za-z]* [0-9]* [0-9]*" /tmp/eas_output.txt | head -1 || echo "1 June 2026")
            echo "eas_limit=true" >> $GITHUB_OUTPUT
            echo "reset_date=${RESET_DATE}" >> $GITHUB_OUTPUT
            echo "build_status=limit" >> $GITHUB_OUTPUT
            exit 0
          fi

          BUILD_JSON=$(eas build:list --platform android --limit 1 --non-interactive --json 2>&1 || echo "[]")
          APK_URL=$(echo "${BUILD_JSON}" | node -e "
            let d=''; process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              try {
                const arr = JSON.parse(d);
                const b = Array.isArray(arr) ? arr[0] : arr;
                const url = b?.artifacts?.buildUrl || b?.artifact?.url || '';
                console.log(url.trim());
              } catch(e) { console.log(''); }
            });
          " 2>/dev/null || echo "")

          echo "apk_url=${APK_URL}" >> $GITHUB_OUTPUT
          if [ -n "${APK_URL}" ]; then
            echo "build_status=success" >> $GITHUB_OUTPUT
          else
            echo "build_status=failed" >> $GITHUB_OUTPUT
          fi

      # ── Free plan limit hit ────────────────────────────────────
      - name: Telegram — EAS Free Plan Limit
        if: steps.eas_build.outputs.build_status == 'limit'
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="⚠️ *Expo Free Plan Limit!*

▓▓▓▓▓▓░░░░ 60% — Ruk gaya

❌ Is mahine ke Android builds khatam ho gaye!
🔄 Reset hoga: *1 June 2026* pe

2 options hain:
1️⃣ expo.dev/accounts/blcobra858/settings/billing pe plan upgrade karo
2️⃣ 18 din baad automatically reset hoga

Code bilkul theek hai — sirf build quota issue hai 💪"
          curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "parse_mode=Markdown" || true

      # ── 90% ── APK ready, bhej raha hoon ──────────────────────
      - name: Telegram — 90% Sending APK
        if: steps.eas_build.outputs.build_status == 'success'
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="🎯 *APK build complete!*

▓▓▓▓▓▓▓▓▓░ 90% — Telegram pe bhej raha hoon...
📲 Bas ek minute aur!"
          curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "parse_mode=Markdown" || true

      # ── 100% ── APK send ───────────────────────────────────────
      - name: Send APK to Telegram
        if: steps.eas_build.outputs.build_status == 'success'
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_URL: ${{ steps.eas_build.outputs.apk_url }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          SHA7="${GITHUB_SHA::7}"
          curl -L -o sultan-agent.apk \
            -H "Authorization: Bearer ${EXPO_TOKEN}" \
            "${APK_URL}" || curl -L -o sultan-agent.apk "${APK_URL}"

          SIZE=$(stat -c%s sultan-agent.apk 2>/dev/null || echo 0)
          MAX=$((49*1024*1024))
          MB=$(echo "scale=1; ${SIZE}/1048576" | bc)

          if [ "${SIZE}" -gt 100000 ] && [ "${SIZE}" -le "${MAX}" ]; then
            curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@sultan-agent.apk" \
              -F "caption=🏆 Sultan Agent APK Ready!

▓▓▓▓▓▓▓▓▓▓ 100% — DONE ✅

📦 Size: ${MB} MB
🔖 Version: Commit ${SHA7}
🔥 Firebase + MultiAI + Memory + JARVIX

Install karo aur enjoy karo! 🚀" || true
          else
            curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "text=🏆 APK Ready!

▓▓▓▓▓▓▓▓▓▓ 100% ✅

📥 Download: ${APK_URL}
🔖 Commit: ${SHA7}" \
              --data-urlencode "parse_mode=Markdown" || true
          fi

      # ── Failed ────────────────────────────────────────────────
      - name: Telegram — Build Failed
        if: steps.eas_build.outputs.build_status == 'failed'
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SHA7="${GITHUB_SHA::7}"
          MSG="❌ *Build Fail!*

░░░░░░░░░░ ERROR

🔖 Commit: `${SHA7}`
📋 Logs: expo.dev/accounts/blcobra858/projects/sultan-agent/builds

Koi code issue hai — logs dekho 👆"
          curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "parse_mode=Markdown" || true
