name: Deploy Bot + Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── Job 1: Deploy Bot to Railway ────────────────────────────────────────────
  deploy-bot:
    name: Deploy Bot to Railway
    runs-on: ubuntu-latest
    steps:
      - name: Push env vars to Railway (with retry)
        continue-on-error: true
        env:
          RAILWAY_TOKEN:    ${{ secrets.RAILWAY_TOKEN }}
          TG_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_KEY:         ${{ secrets.GROQ_API_KEY }}
          GEMINI_KEY:       ${{ secrets.GEMINI_API_KEY }}
          OPENAI_KEY:       ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          SERPER_KEY:       ${{ secrets.SERPER_API_KEY }}
          ELEVEN_KEY:       ${{ secrets.ELEVENLABS_API_KEY }}
          EXPO_KEY:         ${{ secrets.EXPO_TOKEN }}
          GH_PAT:           ${{ secrets.GITHUB_TOKEN }}
        run: |
          node << 'NODEJS'
          const https = require('https');
          const RAILWAY_TOKEN = process.env.RAILWAY_TOKEN;
          const PROJECT_ID = '1450a2ad-ffe6-478f-97ae-4cabdd0f5dea';
          const SERVICE_ID = '4e6ab161-cc6c-4945-81f6-b6242b4eb1f0';
          const ENV_ID     = 'b591b4fe-3105-4155-aa48-aed73d794e5b';

          const vars = {
            TELEGRAM_BOT_TOKEN:   process.env.TG_BOT_TOKEN,
            ADMIN_CHAT_ID:        process.env.TG_CHAT_ID,
            GROQ_API_KEY:         process.env.GROQ_KEY,
            GEMINI_API_KEY:       process.env.GEMINI_KEY,
            OPENAI_API_KEY:       process.env.OPENAI_KEY,
            ANTHROPIC_API_KEY:    process.env.CLAUDE_KEY,
            SERPER_API_KEY:       process.env.SERPER_KEY,
            ELEVENLABS_API_KEY:   process.env.ELEVEN_KEY,
            EXPO_TOKEN:           process.env.EXPO_KEY,
            GITHUB_ACCESS_TOKEN:  process.env.GH_PAT,
            FIREBASE_API_KEY:     'AIzaSyBPQxmPvldjJ5Zt03E5i2xrrhFWpdpYd-s',
            FIREBASE_PROJECT_ID:  'v11345',
            FIREBASE_USER_ID:     'sultan',
          };

          function gql(query) {
            return new Promise((res) => {
              const body = JSON.stringify({ query });
              const req = https.request({
                hostname: 'backboard.railway.app',
                path: '/graphql/v2', method: 'POST', timeout: 30000,
                headers: { 'Authorization': 'Bearer ' + RAILWAY_TOKEN, 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) }
              }, r => { let d=''; r.on('data',c=>d+=c); r.on('end',()=>{ try{res(JSON.parse(d));}catch{res({_error:d.slice(0,100)});} }); });
              req.on('error', e=>res({_error:e.message}));
              req.on('timeout', ()=>{req.destroy();res({_error:'timeout'});});
              req.end(body);
            });
          }

          async function setVar(name, value, retry=3) {
            if (!value) { console.log('SKIP:', name); return; }
            const safe = value.replace(/\\/g,'\\\\').replace(/"/g,'\\"');
            const q = 'mutation { variableUpsert(input: { projectId:"'+PROJECT_ID+'", environmentId:"'+ENV_ID+'", serviceId:"'+SERVICE_ID+'", name:"'+name+'", value:"'+safe+'" }) }';
            for (let i=0; i<retry; i++) {
              const r = await gql(q);
              if (r._error) { console.log('RETRY',i+1,name,'-',r._error); await new Promise(r=>setTimeout(r,3000)); }
              else if (r.errors) { console.log('FAIL:',name,'-',r.errors[0]?.message); return; }
              else { console.log('OK:',name); return; }
            }
            console.log('GIVE UP:',name);
          }

          (async()=>{
            for (const [name, value] of Object.entries(vars)) await setVar(name, value);
            console.log('All vars done. Triggering redeploy...');
            const dep = await gql('mutation { serviceInstanceRedeploy(environmentId:"'+ENV_ID+'", serviceId:"'+SERVICE_ID+'") }');
            console.log(dep.errors ? 'Redeploy err: '+dep.errors[0]?.message : 'Railway redeploy triggered!');
          })().catch(e=>console.log('Fatal:',e.message));
          NODEJS

      - name: Telegram - Bot Deployed
        continue-on-error: true
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -o /dev/null --max-time 10 \
            -X POST "https://api.telegram.org/bot${BOT}/sendMessage" \
            -d "chat_id=${CID}" \
            --data-urlencode "text=Sultan Agent v7.0 God Mode ALL AI deployed! Groq+Gemini+OpenAI+Claude active!"
          echo "Telegram notified"

  # ─── Job 2: Build Android APK ────────────────────────────────────────────────
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Link EAS project + Submit APK build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          OWNER=$(eas whoami | head -1 | awk '{print $1}')
          echo "Logged in as: $OWNER"

          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json','utf8'));
            app.expo.owner = '$OWNER';
            if (!app.expo.extra) app.expo.extra = {};
            app.expo.extra.eas = {};
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
            console.log('app.json owner updated to:', app.expo.owner);
          "

          eas project:init --non-interactive --force 2>/dev/null || true
          eas build --platform android --profile production --non-interactive --no-wait
          echo "APK build submitted to EAS Cloud!"

      - name: Telegram - APK Status
        if: always()
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = "success" ]; then
            MSG="APK build EAS cloud pe submit! 10-15 min mein tayar hogi aur bot seedha file bhejega! Track: https://expo.dev/accounts/haniyashaikh777/projects/sultan-agent/builds"
          else
            MSG="APK build fail hua. GitHub Actions dekho: https://github.com/godofthunder7890-crypto/sultan-agent/actions"
          fi
          curl -s -o /dev/null --max-time 10 \
            -X POST "https://api.telegram.org/bot${BOT}/sendMessage" \
            -d "chat_id=${CID}" \
            --data-urlencode "text=${MSG}"
          echo "Telegram notified - $RESULT"
